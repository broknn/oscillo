<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oscillo Listen</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f11; color: #ecebe4; font: 12px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 6px; align-items: center; padding: 5px 7px; background: rgba(14,15,17,.88); opacity: 0; transition: opacity .15s; -webkit-app-region: drag; }
    body:hover #bar { opacity: 1; }
    select, button { -webkit-app-region: no-drag; font: inherit; color: inherit; background: #1d2024; border: 1px solid #33363c; border-radius: 3px; padding: 2px 6px; }
    #pin.on { color: #0e0f11; background: #ecebe4; }
    #readout { flex: 1; text-align: right; font: 11px Consolas, monospace; color: #8b8d92; white-space: nowrap; overflow: hidden; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; color: #8b8d92; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="msg">Waiting for sound. Play something on this computer.</div>
  <div id="bar">
    <select id="look" title="Look"></select>
    <select id="palette" title="Palette"></select>
    <span id="readout"></span>
    <button id="pin">Pin</button>
    <button id="close" title="Close">×</button>
  </div>
  <script type="module" src="listen.js"></script>
</body>
</html>
